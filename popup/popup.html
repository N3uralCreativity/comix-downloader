<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comix Downloader</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Defaults = comix "Dark" theme; popup.js overrides these with comix's
       actual live theme (captured by the content script) when available. */
    :root {
      --bg: #181a1c; --panel: #202326; --line: rgba(255,255,255,0.07);
      --line-2: rgba(255,255,255,0.11); --fg: #d4d4d4; --fg-strong: #f5f5f5;
      --muted: #a0a0a0; --muted-2: #707070; --accent: #8765eb;
      --accent-bg: rgba(135,101,235,0.16); --accent-line: rgba(135,101,235,0.3);
      --accent-soft: rgba(135,101,235,0.18); --accent-ink: #1a1133;
      --ok: #22c55e; --warn: #eab308; --err: #ef4444;
    }

    body {
      width: 340px;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      overflow-x: hidden;
    }

    /* ── Header ── */
    .header {
      display: flex; align-items: center; gap: 12px;
      padding: 15px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    .header-icon { width: 34px; height: 34px; flex-shrink: 0; overflow: visible; }
    /* "Angle Tray" mark: comix-style idle pulse + hover burst. color-mix keeps it
       working with the dynamic --accent that popup.js applies from the site theme. */
    .header-icon .ink { fill: var(--fg); }
    .header-icon .glow { fill: var(--accent); animation: cdl-glow 1.2s ease-in-out infinite; }
    .header-icon:hover .glow { animation: cdl-burst .35s linear forwards; }
    @keyframes cdl-glow {
      0% { fill: color-mix(in srgb, var(--accent) 90%, transparent); }
      50% { fill: color-mix(in srgb, var(--accent), white 30%); }
      100% { fill: color-mix(in srgb, var(--accent) 90%, transparent); }
    }
    @keyframes cdl-burst {
      0% { fill: color-mix(in srgb, var(--accent) 20%, transparent); filter: none; }
      20% { fill: color-mix(in srgb, var(--accent), white 30%); filter: drop-shadow(0 0 10px var(--accent)) drop-shadow(0 0 20px var(--accent)); }
      40% { fill: color-mix(in srgb, var(--accent) 20%, transparent); filter: drop-shadow(0 0 5px color-mix(in srgb, var(--accent) 50%, transparent)); }
      60% { fill: color-mix(in srgb, var(--accent), white 50%); filter: drop-shadow(0 0 15px var(--accent)) drop-shadow(0 0 30px var(--accent)); }
      80% { fill: color-mix(in srgb, var(--accent), white 70%); filter: drop-shadow(0 0 15px var(--accent)) drop-shadow(0 0 30px var(--accent)); }
      100% { fill: var(--accent); filter: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .header-icon .glow, .header-icon:hover .glow { animation: none; }
    }
    .header-info { flex: 1; min-width: 0; }
    .header-title { font-size: 15px; font-weight: 700; color: var(--fg-strong); letter-spacing: .01em; }
    .header-sub { font-size: 11px; color: var(--muted-2); margin-top: 2px; }
    .header-version {
      font-size: 10px; font-weight: 600; color: var(--accent);
      background: var(--accent-bg); border: 1px solid var(--accent-line);
      border-radius: 5px; padding: 2px 6px; flex-shrink: 0;
    }

    /* ── Actions ── */
    .btn-row { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px;
      padding: 9px 10px; border-radius: 9px; font-size: 12.5px; font-weight: 600;
      cursor: pointer; text-decoration: none; border: 1px solid transparent;
      transition: background .15s, border-color .15s;
    }
    .btn svg { flex-shrink: 0; }
    .btn-primary { background: var(--accent); color: var(--accent-ink); }
    .btn-primary:hover { filter: brightness(1.12); }
    .btn-ghost { background: rgba(255,255,255,0.05); border-color: var(--line-2); color: var(--fg); }
    .btn-ghost:hover { background: rgba(255,255,255,0.1); }
    .pill-new { font-size: 9px; font-weight: 800; letter-spacing: .04em; color: #07101f; background: #fff; padding: 1px 5px; border-radius: 4px; }
    .pill-new[hidden] { display: none; }

    /* ── Star CTA ── */
    .star-cta {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 16px; text-decoration: none;
      background: rgba(245,197,24,0.06);
      border-bottom: 1px solid var(--line);
      color: var(--fg); font-size: 11.5px;
      transition: background .15s;
    }
    .star-cta:hover { background: rgba(245,197,24,0.12); }
    .star-cta[hidden] { display: none; }
    .star-cta .star-ico { flex-shrink: 0; color: #f5c518; }
    .star-cta strong { color: var(--fg-strong); font-weight: 700; }
    .star-cta .star-arrow { margin-left: auto; color: var(--muted-2); flex-shrink: 0; }

    /* ── Logs ── */
    .logs-header { display: flex; align-items: center; justify-content: space-between; padding: 11px 16px 7px; }
    .logs-title { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
    .logs-actions { display: flex; gap: 7px; align-items: center; }
    .logs-count { font-size: 11px; color: var(--muted-2); background: rgba(255,255,255,0.04); border-radius: 4px; padding: 1px 6px; }
    .btn-clear {
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); color: var(--err);
      border-radius: 6px; padding: 3px 9px; font-size: 11px; cursor: pointer; transition: background .15s;
    }
    .btn-clear:hover { background: rgba(239,68,68,0.2); }

    .logs-wrap { height: 252px; overflow-y: auto; padding: 0 8px 8px; scrollbar-width: thin; scrollbar-color: #30343a transparent; }
    .log-empty { text-align: center; color: var(--muted-2); font-size: 12px; padding: 44px 0; }
    .log-entry { display: flex; gap: 6px; padding: 4px 8px; border-radius: 5px; margin-bottom: 1px; font-size: 11px; line-height: 1.4; word-break: break-word; }
    .log-entry:hover { background: rgba(255,255,255,0.03); }
    .log-ts { color: var(--muted-2); flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .log-badge { flex-shrink: 0; font-weight: 700; font-size: 10px; padding: 0 4px; border-radius: 3px; line-height: 1.6; align-self: flex-start; }
    .log-msg { color: #8892b0; flex: 1; }
    .log-entry.info  .log-badge { background: var(--accent-soft); color: var(--accent); }
    .log-entry.ok    .log-badge { background: rgba(34,197,94,.18); color: var(--ok); }
    .log-entry.warn  .log-badge { background: rgba(234,179,8,.18); color: var(--warn); }
    .log-entry.error .log-badge { background: rgba(239,68,68,.18);  color: var(--err); }
    .log-entry.info  .log-msg { color: #7a8cb0; }
    .log-entry.ok    .log-msg { color: #6aaa84; }
    .log-entry.warn  .log-msg { color: #9a8060; }
    .log-entry.error .log-msg { color: #9a5858; }

    /* ── Footer ── */
    .footer { padding: 9px 16px 11px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
    .footer-note { font-size: 10px; color: var(--muted-2); }
    .footer-note strong { color: var(--muted); font-weight: 600; }
    .footer-status { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--muted-2); }
    .footer-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 6px rgba(34,197,94,.4); }
  </style>
</head>
<body>

  <div class="header">
    <svg class="header-icon" viewBox="0 0 24 24" aria-hidden="true">
      <polygon class="glow" points="10,2.6 14,2.6 14,8.6 18.8,8.6 12,15.8 5.2,8.6 10,8.6"></polygon>
      <path class="ink" d="M3 16.8 6.2 20h11.6l3.2-3.2v4.8H3z"></path>
    </svg>
    <div class="header-info">
      <div class="header-title">Comix Downloader</div>
      <div class="header-sub">comix.to chapter downloader</div>
    </div>
    <span class="header-version" id="ext-version">v4.2.7</span>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="btn-settings" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      Settings
      <span class="pill-new" id="settings-new" hidden>NEW</span>
    </button>
    <a class="btn btn-ghost" id="btn-github" href="#" target="_blank" rel="noopener">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
      </svg>
      GitHub
    </a>
  </div>

  <a class="star-cta" id="btn-star" href="#" target="_blank" rel="noopener" title="Star Comix Downloader on GitHub" hidden>
    <svg class="star-ico" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 .587l3.668 7.431 8.2 1.192-5.934 5.787 1.401 8.169L12 18.896l-7.335 3.868 1.401-8.169L.132 9.21l8.2-1.192z"/>
    </svg>
    <span>Enjoying it? <strong>Star us on GitHub</strong> to stay updated</span>
    <svg class="star-arrow" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 18l6-6-6-6"/>
    </svg>
  </a>

  <div class="logs-header">
    <span class="logs-title">Activity Log</span>
    <div class="logs-actions">
      <span class="logs-count" id="log-count">0 entries</span>
      <button class="btn-clear" id="btn-clear">Clear</button>
    </div>
  </div>
  <div class="logs-wrap" id="logs-wrap">
    <div class="log-empty" id="log-empty">No activity yet</div>
  </div>

  <div class="footer">
    <span class="footer-note">by <strong>N3uralCreativity</strong> · MIT</span>
    <span class="footer-status"><span class="footer-dot" title="Extension active"></span> Active</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
