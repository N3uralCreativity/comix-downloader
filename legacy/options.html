<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comix Downloader — Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true"><polygon fill="var(--accent)" points="10,2.6 14,2.6 14,8.6 18.8,8.6 12,15.8 5.2,8.6 10,8.6"/><path fill="var(--fg)" d="M3 16.8 6.2 20h11.6l3.2-3.2v4.8H3z"/></svg>
        <div class="brand-text">
          <h1>Comix Downloader</h1>
          <span class="brand-sub">Settings</span>
        </div>
        <button class="topbar-update-check" id="btn-check-update" type="button" title="Check for updates" aria-label="Check for updates">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 6v5h-5"/><path d="M4 18v-5h5"/>
            <path d="M6.1 9a7 7 0 0 1 11.5-2.6L20 11"/>
            <path d="m4 13 2.4 4.6A7 7 0 0 0 17.9 15"/>
          </svg>
        </button>
        <span class="ver" id="ver">v4.2.33</span>
      </div>
      <div class="topbar-note">
        Settings are stored in this browser only.
        <span class="hl warn">Glitchy</span> and <span class="hl">risky</span> options are marked.
      </div>
    </header>

    <section class="settings-update-panel" id="settings-update-panel" aria-labelledby="settings-update-title" hidden>
      <span class="settings-update-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>
        </svg>
      </span>
      <div class="settings-update-copy">
        <strong id="settings-update-title">Your extension is outdated</strong>
        <span id="settings-update-message">A browser-approved update is ready. Your settings and history will stay intact.</span>
      </div>
      <button class="btn settings-update-action" id="settings-update-action" type="button">Update now</button>
      <span class="settings-update-status" id="settings-update-status" role="status" aria-live="polite"></span>
    </section>

    <div class="layout">
      <nav class="sidebar" id="sidebar" aria-label="Settings sections"></nav>
      <main class="content" id="content"></main>
    </div>

    <div class="savebar" id="savebar" hidden>
      <span class="savebar-msg" id="savebar-msg">You have unsaved changes</span>
      <div class="savebar-actions">
        <button class="btn ghost" id="btn-discard" type="button">Discard</button>
        <button class="btn primary" id="btn-save" type="button">Save changes</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 class="modal-title" id="modal-title"></h2>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="modal-cancel" type="button">Cancel</button>
        <button class="btn" id="modal-confirm" type="button">Confirm</button>
      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toast-wrap" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden />

  <script src="../core/settings.js"></script>
  <script src="options.js"></script>
</body>
</html>
