name = "comix-downloader-badge"
main = "worker.js"
compatibility_date = "2024-11-01"

# KV namespace that stores  hashedId -> "YYYY-MM-DD"  (first-seen).
# Create it once with:  wrangler kv namespace create BADGES
# then paste the returned id below (replace REPLACE_WITH_KV_ID).
kv_namespaces = [
  { binding = "BADGES", id = "8eebf9a8f2734ebab0efb54b7d94ea36" }
]

# Keep the checked-in configuration aligned with the production dashboard.
# Logs are retained at 100%; distributed traces remain disabled.
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
