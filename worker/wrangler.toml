name = "comix-downloader-badge"
main = "worker.js"
compatibility_date = "2026-07-14"
compatibility_flags = ["nodejs_compat"]

# KV stores the globally distributed, read-heavy remote notice document.
kv_namespaces = [
  { binding = "BADGES", id = "8eebf9a8f2734ebab0efb54b7d94ea36" }
]

[[d1_databases]]
binding = "FLAGS_DB"
database_name = "comix-downloader-community"
database_id = "e3c1c615-e5c7-4e73-aa58-47097491f429"
migrations_dir = "migrations"

[[ratelimits]]
name = "READ_RATE_LIMITER"
namespace_id = "420271400"

[ratelimits.simple]
limit = 120
period = 60

[[ratelimits]]
name = "WRITE_RATE_LIMITER"
namespace_id = "420271401"

[ratelimits.simple]
limit = 30
period = 60

# Keep the checked-in configuration aligned with the production dashboard.
# Logs are retained at 100%; distributed traces remain disabled.
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
