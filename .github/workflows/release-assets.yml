name: Build release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  browser:
    name: Package browser ZIPs
    runs-on: windows-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build Chrome and Firefox ZIPs
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $suffix = if ($env:RELEASE_TAG -match '-([A-Za-z][A-Za-z0-9]*)$') { "_$($matches[1])" } else { "" }
          ./scripts/build-release.ps1 -Suffix $suffix

      - name: Upload ZIPs to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $assets = Get-ChildItem -LiteralPath "dist/release" -Filter "*.zip"
          if (-not $assets) {
            throw "No ZIP assets were generated."
          }
          $assetPaths = $assets | ForEach-Object { $_.FullName }
          gh release upload $env:RELEASE_TAG @assetPaths --clobber

  mihon:
    name: Package Mihon APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Mihon APK
        working-directory: mihon-support
        run: |
          chmod +x ./gradlew
          ./gradlew :src:en:comix:assembleRelease --no-daemon

      - name: Stage Mihon APK
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./manifest.json').version")"
          suffix=""
          if [[ "$RELEASE_TAG" =~ -([A-Za-z][A-Za-z0-9]*)$ ]]; then
            suffix="_${BASH_REMATCH[1]}"
          fi
          mkdir -p dist/release
          apk="$(find mihon-support/src/en/comix/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [ -z "$apk" ]; then
            echo "No Mihon APK was generated." >&2
            exit 1
          fi
          cp "$apk" "dist/release/comix-mihon-v${version}${suffix}.apk"

      - name: Upload Mihon APK to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/release/comix-mihon-v*.apk --clobber
