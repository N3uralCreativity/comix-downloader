name: Build release assets

on:
  release:
    types: [published]
  # Rebuild the Mihon APK and the Mihon extension repo for a release that already
  # exists, for example after a failed Mihon job. A release event always runs the
  # workflow file from its tagged commit, so re-running an old run cannot pick up
  # a fix. Browser ZIPs and the version sync run only for newly published releases.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild the Mihon APK for (for example v4.2.38)
        required: true
        type: string

permissions:
  contents: write

jobs:
  browser:
    name: Package and validate browser ZIPs
    if: ${{ github.event_name == 'release' }}
    runs-on: windows-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Build browser ZIPs
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $suffix = if ($tag -match '-([A-Za-z][A-Za-z0-9]*)$') { "_$($matches[1])" } else { "" }
          # The tag is the source of truth — stamp it into both manifests + filenames.
          # Extract just the numeric X.Y.Z so decorative tag names (v2.3.10(BIS),
          # "v2.3.10 (BIS)", v2.3.10-beta, …) all resolve to a clean version.
          $version = [regex]::Match($tag, '\d+(\.\d+){1,3}').Value
          ./scripts/build-release.ps1 -Version $version -Suffix $suffix
          "version=$version" >> $env:GITHUB_OUTPUT
          "suffix=$suffix" >> $env:GITHUB_OUTPUT

      - name: Validate every browser archive
        shell: pwsh
        run: ./scripts/validate-release.ps1 -Version "${{ steps.package.outputs.version }}" -Suffix "${{ steps.package.outputs.suffix }}"

      - name: Lint Firefox package
        run: npx --yes web-ext@10.5.0 lint --source-dir dist/package-work/firefox --warnings-as-errors

      - name: Upload ZIPs to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $assets = Get-ChildItem -LiteralPath "dist/release" -Filter "*.zip"
          if (-not $assets) {
            throw "No ZIP assets were generated."
          }
          $assetPaths = $assets | ForEach-Object { $_.FullName }
          gh release upload $env:RELEASE_TAG @assetPaths --clobber

  mihon:
    name: Package Mihon APK
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      # v3 installed the legacy "tools" package by default, which newer runner
      # images no longer have ("Failed to find package 'tools'"). v4 does not.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Stamp the release version for Mihon
        # The APK's versionCode comes from manifest.json (4.2.38 -> 4023800), which the
        # tagged commit still carries at the previous version (sync-version bumps it after
        # the build). Use the tag, as the browser build does, so Mihon sees every release
        # as an update. A prerelease (v4.3.0-beta) builds one code below its final
        # release, so installing the final release later is still an update.
        run: |
          version="$(echo "$RELEASE_TAG" | grep -oE '[0-9]+(\.[0-9]+){1,3}' | head -n1)"
          if [ -z "$version" ]; then
            echo "::error::No version number in release tag $RELEASE_TAG."
            exit 1
          fi
          IFS=. read -r major minor patch build <<< "$version"
          code=$(( ${major:-0} * 1000000 + ${minor:-0} * 10000 + ${patch:-0} * 100 + ${build:-0} ))
          stamp="$version"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            code=$(( code - 1 ))
            stamp="$(( code / 1000000 )).$(( code / 10000 % 100 )).$(( code / 100 % 100 )).$(( code % 100 ))"
          fi
          sed -i -E "0,/\"version\"[[:space:]]*:[[:space:]]*\"[^\"]+\"/s//\"version\": \"${stamp}\"/" manifest.json
          grep -q "\"version\": \"${stamp}\"" manifest.json || { echo "::error::Could not stamp ${stamp} into manifest.json."; exit 1; }
          echo "MIHON_VERSION_CODE=${code}" >> "$GITHUB_ENV"
          echo "Building the Mihon APK for ${RELEASE_TAG} as ${stamp} (versionCode ${code})"

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Decode release signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ]; then
            echo "::error::SIGNING_KEYSTORE_B64 secret is not set — releases would be debug-signed and break Mihon auto-updates."
            exit 1
          fi
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 -d > mihon-support/signingkey.jks
          if [ ! -s mihon-support/signingkey.jks ]; then
            echo "::error::Decoded keystore is empty — check the SIGNING_KEYSTORE_B64 secret."
            exit 1
          fi

      - name: Build Mihon APK
        working-directory: mihon-support
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :src:en:comix:assembleRelease --no-daemon

      - name: Wipe keystore from runner
        if: always()
        run: rm -f mihon-support/signingkey.jks

      - name: Stage Mihon APK
        shell: bash
        run: |
          version="$(echo "$RELEASE_TAG" | grep -oE '[0-9]+(\.[0-9]+){1,3}' | head -n1)"
          suffix=""
          if [[ "$RELEASE_TAG" =~ -([A-Za-z][A-Za-z0-9]*)$ ]]; then
            suffix="_${BASH_REMATCH[1]}"
          fi
          mkdir -p dist/release
          apk="$(find mihon-support/src/en/comix/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [ -z "$apk" ]; then
            echo "No Mihon APK was generated." >&2
            exit 1
          fi
          # Mihon only offers an update when versionCode goes up; make sure it matches the tag.
          actual="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -oE "versionCode='[0-9]+'" | grep -oE '[0-9]+')"
          echo "Mihon APK versionCode: ${actual} (expected ${MIHON_VERSION_CODE} for ${RELEASE_TAG})"
          if [ "$actual" != "$MIHON_VERSION_CODE" ]; then
            echo "::error::The Mihon APK has versionCode ${actual}, expected ${MIHON_VERSION_CODE} for ${RELEASE_TAG}."
            exit 1
          fi
          cp "$apk" "dist/release/comix-mihon-v${version}${suffix}.apk"

      - name: Upload Mihon APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/release/comix-mihon-v*.apk --clobber

  mihon-repo:
    name: Publish Mihon extension repo
    runs-on: ubuntu-latest
    needs: mihon
    if: ${{ !contains(github.event.release.tag_name || inputs.tag, '-') }}
    permissions:
      contents: write
    # Every run force-pushes the repo branch; run them one at a time.
    concurrency:
      group: mihon-repo-branch
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build-tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Add build-tools to PATH
        run: echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Download Mihon APK from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloaded
          gh release download "$RELEASE_TAG" \
            --pattern 'comix-mihon-v*.apk' \
            --dir downloaded

      - name: Pick the unsuffixed APK
        id: pickapk
        run: |
          version="$(echo "$RELEASE_TAG" | grep -oE '[0-9]+(\.[0-9]+){1,3}' | head -n1)"
          file="downloaded/comix-mihon-v${version}.apk"
          if [ ! -f "$file" ]; then
            file="$(ls downloaded/comix-mihon-v*.apk 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$file" ] || [ ! -f "$file" ]; then
            echo "No Mihon APK was found in release $RELEASE_TAG" >&2
            exit 1
          fi
          echo "apk=$file" >> "$GITHUB_OUTPUT"

      - name: Stage icon
        run: |
          mkdir -p repo-staging/icon
          cp mihon-support/src/en/comix/res/mipmap-xxxhdpi/ic_launcher.png \
             "repo-staging/icon/eu.kanade.tachiyomi.extension.en.comix.png"

      - name: Generate index + repo metadata
        run: |
          python3 mihon-support/repo-tools/build-index.py \
            --apk "${{ steps.pickapk.outputs.apk }}" \
            --out repo-staging

      # A manual run for an older release (for example to attach a missing APK) must not
      # roll the Mihon repo back: Mihon users would then never be offered the newer APK.
      - name: Check the published Mihon repo is not newer
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new_code="$(python3 -c 'import json; print(json.load(open("repo-staging/index.min.json"))[0]["code"])')"
          live="$(gh api "repos/${GITHUB_REPOSITORY}/contents/index.min.json?ref=repo" -H 'Accept: application/vnd.github.raw' 2>/dev/null)" || live='[]'
          live_code="$(printf '%s' "$live" | python3 -c 'import json, sys; d = json.load(sys.stdin); print(d[0]["code"] if d else 0)')"
          echo "Published Mihon repo versionCode: ${live_code}; this build: ${new_code}"
          if [ "$new_code" -lt "$live_code" ]; then
            echo "::warning::${RELEASE_TAG} (versionCode ${new_code}) is older than the published Mihon repo (${live_code}). The APK is on the release; the repo branch was left unchanged."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to repo branch
        if: ${{ steps.guard.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Move staged tree out of the source checkout so we can re-init.
          mv repo-staging /tmp/repo-staging
          cd /tmp/repo-staging

          git init -q -b repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git add .
          git commit -q -m "Publish Comix Mihon repo for $RELEASE_TAG"
          git push -f origin repo

  sync-version:
    name: Sync committed version + docs site
    runs-on: ubuntu-latest
    # Only newly published full releases (no prerelease suffix) update the committed repo + Pages site.
    if: ${{ github.event_name == 'release' && !contains(github.event.release.tag_name, '-') }}
    permissions:
      contents: write

    steps:
      - name: Check out default branch
        uses: actions/checkout@v6.0.2
        with:
          ref: master

      - name: Stamp manifest + docs to the release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = [regex]::Match($env:RELEASE_TAG, '\d+(\.\d+){1,3}').Value
          ./scripts/bump-version.ps1 -Version $version

      - name: Commit and push if anything changed
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(echo "$RELEASE_TAG" | grep -oE '[0-9]+(\.[0-9]+){1,3}' | head -n1)"
          if [ -z "$(git status --porcelain)" ]; then
            echo "Already at v${version} — nothing to sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync version to v${version} [skip ci]"
          git push origin HEAD:master
